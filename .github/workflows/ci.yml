name: build

# Public repository, GitHub-hosted standard runners: free. Do not add paid
# runners (larger or private) or other metered features here.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
