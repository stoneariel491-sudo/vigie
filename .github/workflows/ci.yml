name: build

# Public repository, GitHub-hosted standard runners: free. Do not add paid
# runners (larger or private) or other metered features here.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      VIGIE_MUET: "1"
      VIGIE_MAINTENANT: "1793370620"
    steps:
      - uses: actions/checkout@v4
      - name: "Linux virtual display and software Vulkan"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Installer round trip (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          sh outils/installer.sh
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -x "$HOME/Applications/Vigie.app/Contents/MacOS/vigie"
            test -f "$HOME/Applications/Vigie.app/Contents/Info.plist"
            plutil -lint "$HOME/Applications/Vigie.app/Contents/Info.plist"
          else
            test -x "$HOME/.local/bin/vigie"
            test -f "$HOME/.local/share/applications/vigie.desktop"
            test -f "$HOME/.local/share/icons/hicolor/256x256/apps/vigie.png"
          fi
          sh outils/installer.sh --desinstaller
          test ! -e "$HOME/.local/bin/vigie" && test ! -e "$HOME/Applications/Vigie.app"
      - name: Demo data
        shell: bash
        run: |
          python -m pip install --quiet pillow numpy
          python demo/generer.py
      - name: Render a real frame (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          mkdir -p shots
          export VIGIE_DONNEES="$PWD/demo/donnees"
          xvfb-run -a -s "-screen 0 1600x1000x24" ./target/release/vigie --capture=shots/direct.png --echelle=1 --taille=1280x800 --attente=6
      - name: Render a real frame (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          mkdir -p shots
          export VIGIE_DONNEES="$PWD/demo/donnees"
          ./target/release/vigie --capture=shots/direct.png --echelle=1 --taille=1280x800 --attente=6
      - name: Render a real frame (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p shots
          export VIGIE_DONNEES="$PWD/demo/donnees"
          ./target/release/vigie.exe --capture=shots/direct.png --echelle=1 --taille=1280x800 --attente=6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ matrix.os }}
          path: shots/
          if-no-files-found: warn
